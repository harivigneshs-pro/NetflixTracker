spring.application.name=netflixtracker
spring.datasource.url=jdbc:mysql://localhost:3306/netflix_tracker
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA/Hibernate Configuration
# 'update' is good for development; changes tables to match entities. Use 'none' or 'validate' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# CRITICAL FIX for MySQL 8 / Spring Boot 3 sequence error
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# Server Port (Optional)
server.port=8080